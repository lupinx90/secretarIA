services:
  mobile-tracker:
    build: .
    container_name: mobile_awake_tracker
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TZ=Europe/Madrid
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - IP_TARGETS=${IP_TARGETS}
      - CHECK_INTERVAL=${CHECK_INTERVAL}
      - MANIA_STATUS_API_URL=${MANIA_STATUS_API_URL}
    volumes:
      - ./data:/app/data  # Guarda la BD en la carpeta ./data de la Raspberry Pi